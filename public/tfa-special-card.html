<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/tfa-design-system-8620e8e6-b85b-463c-828f-5b9336793872/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/tfa-design-system-8620e8e6-b85b-463c-828f-5b9336793872/tokens/colors.css">
  <link rel="stylesheet" href="_ds/tfa-design-system-8620e8e6-b85b-463c-828f-5b9336793872/tokens/typography.css">
  <link rel="stylesheet" href="_ds/tfa-design-system-8620e8e6-b85b-463c-828f-5b9336793872/tokens/effects.css">
  <link rel="stylesheet" href="_ds/tfa-design-system-8620e8e6-b85b-463c-828f-5b9336793872/tokens/base.css">
  <link rel="stylesheet" href="_ds/tfa-design-system-8620e8e6-b85b-463c-828f-5b9336793872/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #04080f; }
    .tfa-special { --ca: #f1b813; --ca-light: #ffd24a; --ca-dark: #c8960a; --ce: #2ad4ff; }
    .tfa-special.venom   { --ca: #2ee0c1; --ca-light: #7defd9; --ca-dark: #15a98e; --ce: #c8ff3d; }
    .tfa-special.inferno { --ca: #ff5a3c; --ca-light: #ff8055; --ca-dark: #c8360f; --ce: #ffc62e; }
    .tfa-special.voltage { --ca: #4d8dff; --ca-light: #86b2ff; --ca-dark: #1f5fd6; --ce: #ffd24a; }
    .tfa-special image-slot { display: block; width: 100%; height: 100%; }
    @keyframes tfa-fadeup { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
    @keyframes tfa-barfill { from { width: 0; } to { width: var(--w); } }
    @keyframes tfa-streak { from { transform: translate(-16%, -16%); } to { transform: translate(16%, 16%); } }
    @keyframes tfa-sheen { 0% { transform: translateX(-130%) skewX(-18deg); } 60%, 100% { transform: translateX(260%) skewX(-18deg); } }
    @keyframes tfa-pulse { 0%, 100% { text-shadow: 0 0 14px currentColor, 0 0 30px color-mix(in oklab, currentColor 60%, transparent); } 50% { text-shadow: 0 0 22px currentColor, 0 0 56px currentColor; } }
    @keyframes tfa-trail { 0%, 100% { opacity: 0.22; transform: translateX(-6%) skewX(-9deg) scaleX(1); } 50% { opacity: 0.45; transform: translateX(-13%) skewX(-9deg) scaleX(1.05); } }
    .no-anim *, .no-anim *::before, .no-anim *::after { animation: none !important; }
    .revealed [style*="tfa-fadeup"] { opacity: 1 !important; transform: none !important; }
    .revealed [style*="tfa-barfill"] { width: var(--w) !important; animation: none !important; }
  </style>
</helmet>
<div class="tfa-special {{ editionClass }} {{ animClass }}" data-screen-label="Special Card" style="width: 1080px; height: 1920px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 64px 60px 56px; background: radial-gradient(130% 70% at 50% 0%, #16243f 0%, #0a1322 46%, #05090f 100%); color: var(--cream); font-family: var(--font-body);">

  <sc-if value="{{ showStreaks }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: -22%; pointer-events: none; opacity: 0.1; background-image: repeating-linear-gradient(122deg, var(--ca) 0 3px, transparent 3px 46px); animation: tfa-streak 9s linear infinite alternate;"></div>
    <div style="position: absolute; inset: -22%; pointer-events: none; opacity: 0.08; background-image: repeating-linear-gradient(122deg, var(--ce) 0 2px, transparent 2px 120px); animation: tfa-streak 6s linear infinite alternate-reverse;"></div>
  </sc-if>
  <div style="position: absolute; top: -8%; left: -25%; width: 150%; height: 70%; pointer-events: none; transform: skewY(-13deg); background: linear-gradient(100deg, transparent 30%, color-mix(in oklab, var(--ca) 16%, transparent) 50%, transparent 70%);"></div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; animation: tfa-fadeup 0.5s var(--ease-out) both;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <img src="assets/tfa-logo.png" alt="TFA" style="width: 50px; height: auto; display: block;">
      <div style="font-family: var(--font-condensed); font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.12em; font-size: 20px; line-height: 1; color: var(--cream);">The Football<br>Academy</div>
    </div>
    <div style="font-family: var(--font-condensed); font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.22em; font-size: 18px; color: var(--navy); padding: 9px 20px 9px 16px; background: linear-gradient(120deg, var(--ca-light), var(--ca-dark)); clip-path: polygon(12% 0, 100% 0, 88% 100%, 0 100%); box-shadow: 0 0 24px color-mix(in oklab, var(--ca) 55%, transparent);">Special</div>
  </div>

  <div style="position: relative; margin-top: 30px; height: 760px; animation: tfa-fadeup 0.6s var(--ease-out) 0.05s both;">
    <div style="position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%); background: linear-gradient(150deg, var(--ca-light), var(--ca) 45%, var(--ca-dark)); filter: drop-shadow(0 0 34px color-mix(in oklab, var(--ca) 55%, transparent));"></div>
    <div style="position: absolute; inset: 5px; clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%); overflow: hidden; background: var(--navy);">
      <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="tfa-special-photo" src="assets/somchai.png" placeholder="Drop player photo" shape="rect" fit="cover" hint-size="100%,100%"></x-import>
      <div style="position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; background: linear-gradient(150deg, color-mix(in oklab, var(--ca) 55%, transparent) 0%, transparent 42%);"></div>
      <div style="position: absolute; inset: auto 0 0 0; height: 52%; pointer-events: none; background: linear-gradient(to top, rgba(5,9,15,0.97) 6%, rgba(5,9,15,0.5) 42%, transparent 100%);"></div>
    </div>

    <div style="position: absolute; top: 22px; right: 22px; display: flex; flex-direction: column; gap: 11px; align-items: flex-end;">
      <span style="font-family: var(--font-condensed); font-weight: 700; font-style: italic; letter-spacing: 0.14em; font-size: 26px; color: var(--navy); background: var(--pos-mid); padding: 8px 20px 8px 16px; clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%); box-shadow: 0 6px 16px rgba(0,0,0,0.4);">MID</span>
      <span style="font-family: var(--font-condensed); font-weight: 700; font-style: italic; letter-spacing: 0.14em; font-size: 23px; color: var(--ca-light); background: rgba(5,9,15,0.7); border: 1px solid var(--ca); padding: 7px 20px 7px 16px; clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%); backdrop-filter: blur(6px);">U10</span>
    </div>

    <div style="position: absolute; left: 16px; bottom: 22px; display: flex; align-items: flex-end; gap: 14px;">
      <div style="position: relative; line-height: 0.8;">
        <span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; font-family: var(--font-display); font-style: italic; font-size: 150px; color: var(--ca); animation: tfa-trail 2.4s var(--ease-out) infinite;">8.5</span>
        <span style="position: relative; font-family: var(--font-display); font-style: italic; font-size: 150px; color: var(--ca-light); animation: tfa-pulse 2.6s ease-in-out infinite;">8.5</span>
      </div>
      <span style="font-family: var(--font-condensed); font-weight: 700; font-style: italic; letter-spacing: 0.28em; font-size: 22px; color: var(--cream); padding-bottom: 30px;">OVR</span>
    </div>
  </div>

  <div style="position: relative; z-index: 3; margin-top: -26px; display: flex; justify-content: center; animation: tfa-fadeup 0.6s var(--ease-out) 0.12s both;">
    <div style="position: relative; overflow: hidden; background: linear-gradient(120deg, var(--ca-light), var(--ca) 50%, var(--ca-dark)); color: var(--navy); font-family: var(--font-display); font-style: italic; font-size: 58px; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1; padding: 16px 56px; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); box-shadow: 0 12px 34px rgba(0,0,0,0.5), 0 0 30px color-mix(in oklab, var(--ca) 45%, transparent); white-space: nowrap;">
      <span style="position: relative; z-index: 2;">Leo Sáng</span>
      <div style="position: absolute; top: 0; left: 0; width: 30%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: tfa-sheen 4.5s ease-in-out 1s infinite; z-index: 1;"></div>
    </div>
  </div>

  <div style="margin-top: 42px; display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; align-items: center; gap: 22px; animation: tfa-fadeup 0.5s var(--ease-out) 0.30s both;">
      <span style="width: 250px; font-family: var(--font-condensed); font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.1em; font-size: 30px; color: var(--cream);">Pace</span>
      <div style="flex: 1; height: 18px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden;"><div style="--w: 92%; width: var(--w); height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--ca-dark), var(--ca-light)); box-shadow: 0 0 16px color-mix(in oklab, var(--ca) 60%, transparent); animation: tfa-barfill 1.1s var(--ease-out) 0.45s both;"></div></div>
      <span style="width: 58px; text-align: right; font-family: var(--font-display); font-style: italic; font-size: 46px; color: var(--ca-light);">9</span>
    </div>
    <div style="display: flex; align-items: center; gap: 22px; animation: tfa-fadeup 0.5s var(--ease-out) 0.37s both;">
      <span style="width: 250px; font-family: var(--font-condensed); font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.1em; font-size: 30px; color: var(--cream);">Acceleration</span>
      <div style="flex: 1; height: 18px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden;"><div style="--w: 92%; width: var(--w); height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--ca-dark), var(--ca-light)); box-shadow: 0 0 16px color-mix(in oklab, var(--ca) 60%, transparent); animation: tfa-barfill 1.1s var(--ease-out) 0.52s both;"></div></div>
      <span style="width: 58px; text-align: right; font-family: var(--font-display); font-style: italic; font-size: 46px; color: var(--ca-light);">9</span>
    </div>
    <div style="display: flex; align-items: center; gap: 22px; animation: tfa-fadeup 0.5s var(--ease-out) 0.44s both;">
      <span style="width: 250px; font-family: var(--font-condensed); font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.1em; font-size: 30px; color: var(--cream);">Agility</span>
      <div style="flex: 1; height: 18px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden;"><div style="--w: 80%; width: var(--w); height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--ca-dark), var(--ca-light)); box-shadow: 0 0 16px color-mix(in oklab, var(--ca) 60%, transparent); animation: tfa-barfill 1.1s var(--ease-out) 0.59s both;"></div></div>
      <span style="width: 58px; text-align: right; font-family: var(--font-display); font-style: italic; font-size: 46px; color: var(--ca-light);">8</span>
    </div>
    <div style="display: flex; align-items: center; gap: 22px; animation: tfa-fadeup 0.5s var(--ease-out) 0.51s both;">
      <span style="width: 250px; font-family: var(--font-condensed); font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.1em; font-size: 30px; color: var(--cream);">Dribbling</span>
      <div style="flex: 1; height: 18px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden;"><div style="--w: 80%; width: var(--w); height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--ca-dark), var(--ca-light)); box-shadow: 0 0 16px color-mix(in oklab, var(--ca) 60%, transparent); animation: tfa-barfill 1.1s var(--ease-out) 0.66s both;"></div></div>
      <span style="width: 58px; text-align: right; font-family: var(--font-display); font-style: italic; font-size: 46px; color: var(--ca-light);">8</span>
    </div>
    <div style="display: flex; align-items: center; gap: 22px; animation: tfa-fadeup 0.5s var(--ease-out) 0.58s both;">
      <span style="width: 250px; font-family: var(--font-condensed); font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.1em; font-size: 30px; color: var(--cream);">Stamina</span>
      <div style="flex: 1; height: 18px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden;"><div style="--w: 80%; width: var(--w); height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--ca-dark), var(--ca-light)); box-shadow: 0 0 16px color-mix(in oklab, var(--ca) 60%, transparent); animation: tfa-barfill 1.1s var(--ease-out) 0.73s both;"></div></div>
      <span style="width: 58px; text-align: right; font-family: var(--font-display); font-style: italic; font-size: 46px; color: var(--ca-light);">8</span>
    </div>
    <div style="display: flex; align-items: center; gap: 22px; animation: tfa-fadeup 0.5s var(--ease-out) 0.65s both;">
      <span style="width: 250px; font-family: var(--font-condensed); font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.1em; font-size: 30px; color: var(--cream);">Finishing</span>
      <div style="flex: 1; height: 18px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden;"><div style="--w: 70%; width: var(--w); height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--ca-dark), var(--ca-light)); box-shadow: 0 0 16px color-mix(in oklab, var(--ca) 60%, transparent); animation: tfa-barfill 1.1s var(--ease-out) 0.80s both;"></div></div>
      <span style="width: 58px; text-align: right; font-family: var(--font-display); font-style: italic; font-size: 46px; color: var(--ca-light);">7</span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; animation: tfa-fadeup 0.5s var(--ease-out) 0.85s both;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 34px; height: 4px; background: var(--ca); transform: skewX(-30deg);"></div>
      <div style="font-family: var(--font-condensed); font-weight: 600; font-style: italic; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); font-size: 23px;">12 Sessions &bull; Class of U10</div>
    </div>
    <div style="font-family: var(--font-condensed); font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 0.16em; color: var(--ca); font-size: 24px;">#TFA</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1080, &quot;height&quot;: 1920 },
  &quot;edition&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;prime&quot;, &quot;venom&quot;, &quot;inferno&quot;, &quot;voltage&quot;], &quot;default&quot;: &quot;prime&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;animate&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;showStreaks&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; }
}">
class Component extends DCLogic {
  state = { revealed: false };
  componentDidMount() {
    // Guarantee content is visible even if the animation timeline never ticks
    // (offscreen renderers, throttled background tabs, social preview crawlers).
    this._revealT = setTimeout(() => this.setState({ revealed: true }), 1500);
  }
  componentWillUnmount() { clearTimeout(this._revealT); }
  renderVals() {
    const animate = this.props.animate ?? true;
    return {
      editionClass: this.props.edition || 'prime',
      animClass: !animate ? 'no-anim' : (this.state.revealed ? 'revealed' : ''),
      showStreaks: this.props.showStreaks ?? true,
    };
  }
}
</script>
</body>
</html>
