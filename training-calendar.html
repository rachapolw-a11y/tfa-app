  :root {
    --navy: #070f1e;
    --navy-soft: #0b1526;
    --navy-mid: #16294a;
    --line: #25375a;
    --gold: #f1b813;
    --white: #ffffff;
    /* theme-able card tokens (midnight defaults) — overridden by .card.theme-cream */
    --surface: var(--navy);
    --surface-soft: var(--navy-soft);
    --gold-ink: var(--gold);
    --ink-soft: rgba(255,255,255,0.82);
    --ink-faint: rgba(255,255,255,0.035);
    --tile-grad: linear-gradient(150deg, #16294a 0%, #0b1526 100%);
    --tile-shadow: 0 8px 20px rgba(0,0,0,0.4);
    /* 4in x 6in @ 150dpi = 600 x 900 px working canvas (PORTRAIT) */
    --w: 600px;
    --h: 900px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: #1a1e26;
    font-family: 'Barlow', sans-serif;
    color: #d7deea;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 22px;
    background: rgba(11,21,38,0.85);
    backdrop-filter: saturate(140%) blur(14px);
    -webkit-backdrop-filter: saturate(140%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .toolbar .brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 14px;
    color: #8fa1bd;
    margin-right: auto;
  }
  .toolbar .hint {
    font-family: 'Barlow', sans-serif;
    font-size: 12.5px;
    color: #6b7789;
    margin-right: 8px;
  }
  .btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 14px;
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease, background .12s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-gold { background: var(--gold); color: var(--navy); box-shadow: 0 0 0 0 rgba(241,184,19,0); }
  .btn-gold:hover { filter: brightness(1.06); box-shadow: 0 6px 22px rgba(241,184,19,0.35); }
  .btn-ghost { background: transparent; color: #cdd7e6; border: 1px solid var(--line); }
  .btn-ghost:hover { background: #16233c; }

  /* ---------- Stage ---------- */
  .stage {
    display: flex;
    justify-content: center;
    padding: 40px 20px 80px;
  }

  /* ---------- The printable card ---------- */
  .card {
    width: var(--w);
    height: var(--h);
    position: relative;
    background: var(--surface);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    transition: background .2s ease;
  }

  /* ---------- Cream theme (tweak) ---------- */
  .card.theme-cream {
    --surface: #f5f0e8;
    --surface-soft: #ece1c8;
    --white: #12203d;
    --ink-soft: rgba(18,32,61,0.72);
    --ink-faint: rgba(18,32,61,0.05);
    --line: #ddcda4;
    --gold-ink: #8a6510;
    --tile-grad: linear-gradient(150deg, #ffffff 0%, #efe4c8 100%);
    --tile-shadow: 0 8px 20px rgba(120,95,40,0.16);
  }

  .watermark {
    position: absolute;
    top: 300px;
    left: -30px;
    font-family: 'Tottenham', sans-serif;
    font-weight: 900;
    font-size: 460px;
    line-height: 0.8;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: -0.04em;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }

  .layer { position: relative; z-index: 2; }

  /* header */
  .head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 32px 34px 0;
  }
  .head .crest { display: flex; align-items: center; gap: 13px; }
  .head .crest img { height: 68px; width: auto; }
  .wordmark {
    font-family: 'Tottenham', sans-serif;
    font-weight: 900;
    color: var(--white);
    font-size: 21px;
    line-height: 0.9;
    text-transform: uppercase;
  }
  .subtag {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    color: var(--gold-ink);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-top: 5px;
  }
  .contacts { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .contacts .row { display: flex; align-items: center; gap: 7px; }
  .contacts .row span.t {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    color: var(--ink-soft);
    font-size: 11px;
    white-space: nowrap;
  }
  .contacts .row span.dim { opacity: 0.6; }
  .ic {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
    color: var(--navy); font-size: 9px;
  }

  /* title */
  .titleblock {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 34px 34px 0;
  }
  .kicker {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; color: var(--gold-ink);
    font-size: 15px; letter-spacing: 0.28em; text-transform: uppercase;
  }
  .month {
    font-family: 'Tottenham', sans-serif;
    font-weight: 900; color: var(--white);
    font-size: 108px; line-height: 0.82; text-transform: uppercase; margin-top: 6px;
  }
  .yearblock { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; padding-bottom: 8px; }
  .year { font-family: 'Tottenham', sans-serif; font-weight: 900; color: var(--gold-ink); font-size: 34px; line-height: 0.9; }
  .agegroup {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    color: var(--ink-soft); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
  }

  /* grid */
  .grid { padding: 30px 34px 0; display: flex; flex-direction: column; gap: 12px; }
  .grid .rowh, .grid .week { display: grid; grid-template-columns: repeat(3,1fr); gap: 11px; }
  .dayhead {
    background: var(--gold); border-radius: 999px; padding: 6px 0; text-align: center;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; color: var(--navy);
    font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .tile {
    position: relative; height: 104px; border-radius: 14px;
    background: var(--tile-grad);
    border: 1px solid var(--line);
    box-shadow: var(--tile-shadow);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .tile .corner {
    position: absolute; top: 0; right: 0; width: 30px; height: 30px;
    background: var(--gold); clip-path: polygon(100% 0, 0 0, 100% 100%); opacity: 0.9;
  }
  .tile .mon {
    position: absolute; top: 8px; left: 11px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; color: var(--gold-ink);
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .tile .num { font-family: 'Tottenham', sans-serif; font-weight: 900; color: var(--white); font-size: 60px; line-height: 1; }
  .tile .ul { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: 30px; height: 3px; border-radius: 2px; background: var(--gold); }

  /* footer */
  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 0 34px; height: 66px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 2px solid var(--gold); background: var(--surface-soft);
  }
  .foot .days {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; color: var(--white);
    font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .foot .cta {
    background: var(--gold); border-radius: 999px; padding: 7px 16px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; color: var(--navy);
    font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
  }

  /* editable affordance */
  [contenteditable="true"] { outline: none; border-radius: 4px; transition: box-shadow .12s ease, background .12s ease; }
  body:not(.exporting) [contenteditable="true"]:hover { box-shadow: 0 0 0 1.5px rgba(241,184,19,0.4); }
  body:not(.exporting) [contenteditable="true"]:focus { box-shadow: 0 0 0 2px var(--gold); background: rgba(241,184,19,0.08); }

  /* ---------- Print: exact 6in x 4in ---------- */
  @page { size: 4in 6in; margin: 0; }
  @media print {
    .toolbar, .stage { padding: 0; }
    .toolbar { display: none !important; }
    html, body { background: #fff; }
    .stage { display: block; }
    .card {
      width: 4in; height: 6in; box-shadow: none;
      transform: scale(calc(4 / (600/96)));
      transform-origin: top left;
    }
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="brand">TFA · Training Calendar · 4 × 6 in</span>
  <span class="hint">Click any text to edit</span>
  <select id="monthSelect" class="btn btn-ghost" style="appearance:auto;"></select>
  <button class="btn btn-ghost" id="btnTheme">Tweaks: Cream</button>
  <button class="btn btn-ghost" id="btnPng">Export PNG</button>
  <button class="btn btn-gold" id="btnPdf">Export PDF</button>
</div>

<div class="stage">
  <div class="card" id="card">

    <div class="watermark" aria-hidden="true">07</div>

    <!-- HEADER -->

  wrap.style.gap = '10px';

  const monthEl = document.querySelector('.month');
  const yearEl = document.querySelector('.year');
  const watermarkEl = document.querySelector('.watermark');
  const monthSelect = document.getElementById('monthSelect');

  MONTHS.forEach((m, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = m;
    monthSelect.appendChild(opt);
  });

  function getYear() {
    const y = parseInt(yearEl.textContent, 10);
    return Number.isFinite(y) ? y : new Date().getFullYear();
  }

  // every Wed/Thu/Fri triplet that falls fully inside the month, capped at 4 weeks (card height)
  function computeWeeks(year, monthIndex) {
    const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
    const result = [];
    for (let d = 1; d <= daysInMonth; d++) {
      if (new Date(year, monthIndex, d).getDay() === 3) { // Wednesday
        const thu = d + 1, fri = d + 2;
        if (fri <= daysInMonth) result.push([d, thu, fri]);
      }
    }
    return result.slice(0, 4);
  }

  function renderMonth(monthIndex) {
    const year = getYear();
    const monAbbr = MONTHS[monthIndex].slice(0, 3).toUpperCase();
    const weeks = computeWeeks(year, monthIndex);

    monthEl.textContent = MONTHS[monthIndex];
    watermarkEl.textContent = String(monthIndex + 1).padStart(2, '0');

    wrap.innerHTML = weeks.map(row => `
      <div class="week">
        ${row.map(d => `
          <div class="tile">
            <div class="corner"></div>
            <span class="mon" contenteditable="true">${monAbbr}</span>
            <span class="num" contenteditable="true">${d}</span>
            <div class="ul"></div>
          </div>`).join('')}
      </div>`).join('');
  }

  const initialMonth = MONTHS.indexOf(monthEl.textContent.trim());
  monthSelect.value = initialMonth >= 0 ? initialMonth : 6;
  renderMonth(parseInt(monthSelect.value, 10));

  monthSelect.addEventListener('change', () => renderMonth(parseInt(monthSelect.value, 10)));
  yearEl.addEventListener('blur', () => renderMonth(parseInt(monthSelect.value, 10)));

  // ---- theme tweak: midnight <-> cream ----
  const btnTheme = document.getElementById('btnTheme');
  btnTheme.addEventListener('click', () => {
    const isCream = card.classList.toggle('theme-cream');
    btnTheme.textContent = isCream ? 'Tweaks: Midnight' : 'Tweaks: Cream';
  });

  // ---- export helpers ----
  const card = document.getElementById('card');

  async function snapshot(scale) {
    document.body.classList.add('exporting');
    // strip any active selection outlines
    const active = document.activeElement;
    if (active && active.blur) active.blur();
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const canvas = await html2canvas(card, {
      scale,
      backgroundColor: getComputedStyle(card).backgroundColor,
      useCORS: true,
      width: 600,
      height: 900,
      windowWidth: 600,
      windowHeight: 900,
    });
    document.body.classList.remove('exporting');
    return canvas;
  }

  document.getElementById('btnPng').addEventListener('click', async () => {
    const btn = document.getElementById('btnPng');
    const label = btn.textContent; btn.textContent = 'Rendering…'; btn.disabled = true;
    try {
      // 300 dpi over 4in = 1200px wide → scale 2 on the 600px design
      const canvas = await snapshot(2);
      const a = document.createElement('a');
      a.download = 'TFA-Training-Calendar-4x6-300dpi.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    } finally { btn.textContent = label; btn.disabled = false; }
  });

  document.getElementById('btnPdf').addEventListener('click', async () => {
    const btn = document.getElementById('btnPdf');
    const label = btn.textContent; btn.textContent = 'Rendering…'; btn.disabled = true;
    try {
      const canvas = await snapshot(3); // crisp for print
      const img = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'in', format: [4, 6] });
      pdf.addImage(img, 'PNG', 0, 0, 4, 6);
      pdf.save('TFA-Training-Calendar-4x6.pdf');
    } finally { btn.textContent = label; btn.disabled = false; }
  });
</script>

</body>
</html>
